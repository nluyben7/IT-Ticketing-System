<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quinndustries — IT Support</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
  <div class="hero"> </div>
  <h1> Quinndustries IT Ticketing System</h1>
  

  <section id="ticket-submission">

    <form method="POST" action="/tickets" id="ticket-form">

      <fieldset>
        <div class="form-row">
          <div class="form-group">
            <label for="name-input">Your Name</label>
            <input id="name-input" type="text" name="ticketer_name" required placeholder="e.g. Jane Doe">
          </div>
          <div class="form-group">
            <label for="email-input">Employee Email</label>
            <input id="email-input" type="email" name="email" required placeholder="e.g. janedoe@Quinndustries.com">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <div class="form-group"> 
          <label for="category-input">Type of Issue</label>
        <select id="category-input" name="issue_type" required>
          <option value="">-Select a Category-</option>
          <option value="hardware">Hardware</option>
          <option value="software">Software/Applications</option>
          <option value="printer">Printer</option>
          <option value="security">Security and Account Access</option>
          <option value="other">Other</option>
        </select>
        </div>
      </fieldset>

      <fieldset>
        <div class="form-group">
          <label for="summary-input">Short Summary</label>
          <input id="summary-input" type="text" name="summary" required placeholder="e.g. Cant Print to Library printer">
        </div>
        <div class="form-group">
          <label for="description-input">Problem Description</label>
          <textarea id="description-input" name="description" required rows="5" cols="70" placeholder="describe what you want to accomplish, what went wrong, and what you've already tried"></textarea>
        </div>
      </fieldset>

      <button id="submit-btn">Submit Ticket</button>
    </form>

  </section>
  

  <section id="ticket-viewer">
    <a href="/tickets/view" id="view-tickets-btn">View All Tickets</a>
  </section>

  <script>
    document.getElementById('ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
          ticketer_name: document.getElementById('name-input').value.trim(),
          ticketer_email:         document.getElementById('email-input').value.trim(),
          issue_type:    document.getElementById('category-input').value,
          summary:       document.getElementById('summary-input').value.trim(),
          description:   document.getElementById('description-input').value.trim(),
      };

      const response = await fetch('/tickets', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
          });

      const data = await response.json();

      if (response.ok) {
          // handle success — e.g. show a confirmation message or redirect
          console.log('Ticket created:', data);
      } else {
          // Flask returned a 400 — show the error to the user
          console.error('Error:', data.error);
      }
      document.getElementById('ticket-form').reset();
      });
  </script>

</body>
</html>
